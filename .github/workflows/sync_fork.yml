name: Fork Sync
permissions:
  contents: write
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge upstream while preserving deployment configuration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch upstream main
          cp wrangler.toml /tmp/lumebox-wrangler.toml
          cp .github/workflows/sync_fork.yml /tmp/lumebox-sync.yml
          if ! git merge --no-commit --no-ff upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            for path in $conflicts; do
              case "$path" in wrangler.toml|.github/workflows/sync_fork.yml) ;; *) exit 1;; esac
            done
          fi
          cp /tmp/lumebox-wrangler.toml wrangler.toml
          cp /tmp/lumebox-sync.yml .github/workflows/sync_fork.yml
          git add wrangler.toml .github/workflows/sync_fork.yml
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run deploy -- --dry-run
      - name: Publish validated update
        run: |
          if test -f .git/MERGE_HEAD || ! git diff --cached --quiet; then
            git commit -m "Sync validated upstream danmu_api"
            git push origin HEAD:main
          fi
